<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDayTube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 1.8em;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        h1 .vermelho {
            color: #ff0000;
        }

        .subtitulo {
            font-size: 0.85em;
            color: #bbb;
            line-height: 1.5;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .subtitulo .vermelho {
            color: #ff0000;
        }

        .caixa-video {
            width: 100%;
            max-width: 600px;
            height: 350px;
            border: 2px solid #ff0000;
            border-radius: 12px;
            background: #111;
            margin: 0 auto 40px;
        }

        .botao {
            display: inline-block;
            background: #ff0000;
            color: #fff;
            font-size: 0.95em;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.3s;
        }

        .botao:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- TÍTULO -->
    <h1>
        Ganhe muito, trabalhe pouco e<br>
        tenha custo zero <span class="vermelho">no YouTube</span>.
    </h1>

    <!-- SUBTÍTULO -->
    <p class="subtitulo">
        Crie canais em vários países sem custo. Tenha uma <span class="vermelho">audiência global</span> sem mostrar o rosto e ganhe em qualquer moeda. <span class="vermelho">Assista ao vídeo</span> e veja como é simples.
    </p>

    <!-- CAIXA DE VÍDEO -->
    <div class="caixa-video"></div>

    <!-- BOTÃO -->
    <a href="#" class="botao">quero mudar agora</a>

</body>
</html>
